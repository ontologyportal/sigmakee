# fly.toml app configuration file generated for sigmakee on 2026-08-27T08:08:49-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sigmakee'
primary_region = 'sjc'

[build]
[[mounts]]
  source = 'sigma_vol'
  destination = '/root/.sigmakee'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '16gb'
  cpus = 8
  memory_mb = 16384
